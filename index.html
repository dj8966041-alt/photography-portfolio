<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diego Jauregui</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header id="header">
    <a class="site-name" id="homeLink" href="#">Diego Jauregui</a>
    <nav class="site-nav" id="siteNav">
      <a href="#" class="nav-home" id="navHome">Home</a>
      <span class="nav-section" id="navSection"></span>
    </nav>
  </header>

  <!-- HOME VIEW -->
  <div id="homeView" class="view active">
    <div class="masonry" id="homeGrid"></div>
  </div>

  <!-- EVENT VIEW -->
  <div id="eventView" class="view">
    <div class="masonry" id="eventGrid"></div>
  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox">
    <button class="lb-close" id="lbClose">&#x2715;</button>
    <button class="lb-prev" id="lbPrev">&#8592;</button>
    <img id="lbImg" src="" alt="" />
    <button class="lb-next" id="lbNext">&#8594;</button>
    <div class="lb-counter" id="lbCounter"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
